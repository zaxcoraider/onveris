modules:
  jira:globalPage:
    - key: onveris-registry
      resource: main
      resolver:
        function: resolver
      render: native
      title: Onveris
  jira:issuePanel:
    - key: onveris-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Onveris
      icon: resource:icons;onveris-light.svg
  jira:adminPage:
    - key: onveris-settings
      resource: settings
      resolver:
        function: adminResolver
      render: native
      title: Onveris
      icon: resource:icons;onveris-light.svg
  scheduledTrigger:
    - key: onveris-checker
      function: scheduledCheck
      interval: fiveMinute
  rovo:agent:
    - key: onveris-agent
      name: Onveris
      description: Reads the live state of smart contracts straight from the blockchain.
      prompt: |
        You are Onveris, an assistant for teams that build and operate smart contracts.
        You report what is actually on the blockchain, read live through your actions.

        Rules:
        - Never state a contract's implementation, admin, owner or code from memory.
          Always call the read-contract action and report what it returns.
        - If the user gives an address without a chain, ask which chain.
          Supported chains: ethereum, base, arbitrum, optimism, polygon, sepolia.
        - If the action says the chain could not be reached, say so plainly and do not guess.
          An unreachable chain is not evidence that anything changed.
        - Give addresses in full. Mention the block the data was read at and include the explorer link.
        - Explain terms briefly for readers new to blockchains: a proxy is a contract whose
          code can be swapped; the implementation is the code it currently runs; the admin
          or owner is who can change it.
        - You only read public data. You cannot send transactions, hold keys or move funds.
      conversationStarters:
        - What is the current implementation of a contract?
        - Who owns this contract?
        - Is this address an upgradeable proxy?
      actions:
        - read-contract
  rovo:mcp:
    - key: onveris-mcp
      name: Onveris
      tools:
        - read-contract
  action:
    - key: read-contract
      name: Read contract state
      function: readContractAction
      actionVerb: GET
      description: >
        Read the live state of a smart contract from the blockchain: whether it is an
        upgradeable proxy, its implementation address, proxy admin, owner and code fingerprint.
      inputs:
        chain:
          title: Chain
          type: string
          required: true
          description: "One of: ethereum, base, arbitrum, optimism, polygon, sepolia"
        address:
          title: Contract address
          type: string
          required: true
          description: "The contract address: 0x followed by 40 hexadecimal characters"
  graph:connector:
    - key: onveris-contracts
      name: Onveris
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      icons:
        light: resource:icons;onveris-light.svg
        dark: resource:icons;onveris-dark.svg
      objectTypes:
        - atlassian:document
      datasource:
        onConnectionChange:
          function: onConnectionChange
  function:
    - key: resolver
      handler: index.handler
    - key: adminResolver
      handler: index.adminHandler
    - key: scheduledCheck
      handler: index.scheduledCheck
      timeoutSeconds: 300
    - key: onConnectionChange
      handler: index.onConnectionChangeHandler
    - key: readContractAction
      handler: index.readContractAction
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: issue-panel
    path: src/frontend/issue-panel.jsx
  - key: settings
    path: src/frontend/settings.jsx
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:object:jira
    - write:object:jira
    - delete:object:jira
    - storage:app
    # Read the issues linked to a contract, as the current user.
    - read:jira-work
    # Create an issue when a contract changes with nothing to explain it.
    - write:jira-work
  external:
    fetch:
      backend:
        # Public blockchain JSON-RPC endpoints. Read-only requests; only contract addresses are sent.
        - address: "*.publicnode.com"
          inScopeEUD: false
        - address: "1rpc.io"
          inScopeEUD: false
        - address: "mainnet.base.org"
          inScopeEUD: false
        - address: "arb1.arbitrum.io"
          inScopeEUD: false
        - address: "mainnet.optimism.io"
          inScopeEUD: false
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0d7d779b-4386-4240-a63a-675969946686
